<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Prático Escolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://script.google.com/macros/s/AKfycbzP_n9hFNcnMgDzEIUTYyl5CVa__JPWBbOF7F20p46B9qgwVx8o0p21ay62qRq3bzM4/exec" rel="stylesheet">
  <style>
    /* MANTENDO SEUS ESTILOS ORIGINAIS INTEGRALMENTE */
    :root {
      --verde:#2e7d32;--verde-cl:#e8f5e9;
      --azul:#1565c0;--azul-cl:#e3f2fd;--azul-dark:#0d47a1;
      --amarelo:#f57f17;--amar-cl:#fff8e1;
      --vermelho:#c62828;--verm-cl:#ffebee;
      --roxo:#6a1b9a;--roxo-cl:#f3e5f5;
      --laranja:#e65100;--laran-cl:#fff3e0;
      --cinza:#f5f6fa;--borda:#dde3ec;
      --texto:#1a1d23;--texto2:#5a6478;
      --branco:#ffffff;
      --sombra:0 2px 12px rgba(0,0,0,0.08);
      --raio:12px;
      --sidebar-w:224px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito Sans',sans-serif;background:var(--cinza);color:var(--texto);font-size:15px;line-height:1.6;overflow-x:hidden;}

    /* ESTILOS DE LOGIN (ORIGINAL) */
    #loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--azul-dark) 0%,var(--azul) 60%,#1976d2 100%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
    .login-card{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:48px 44px 40px;width:100%;max-width:400px;text-align:center;position:relative;animation:loginEntrada 0.5s cubic-bezier(.4,0,.2,1);}
    @keyframes loginEntrada{from{opacity:0;transform:translateY(30px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
    .login-logo{font-size:3.5rem;margin-bottom:8px;}
    .login-sistema-nome{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;color:var(--azul-dark);margin-bottom:4px;}
    .login-sistema-sub{font-size:0.82rem;color:var(--texto2);margin-bottom:28px;}
    .login-usuarios{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
    .login-usuario-btn{background:var(--cinza);border:2px solid var(--borda);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.18s;text-align:left;}
    .login-usuario-btn:hover,.login-usuario-btn.selecionado{border-color:var(--azul);background:var(--azul-cl);}
    .login-user-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--azul),var(--azul-dark));display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;font-family:'Nunito',sans-serif;font-weight:900;flex-shrink:0;}
    .login-user-info .login-user-nome{font-family:'Nunito',sans-serif;font-weight:800;font-size:0.92rem;color:var(--texto);}
    .login-user-info .login-user-cargo{font-size:0.74rem;color:var(--texto2);}
    .login-senha-wrap{position:relative;margin-bottom:8px;}
    .login-senha-wrap input{border:2px solid var(--borda);border-radius:10px;padding:10px 44px 10px 14px;font-family:'Nunito Sans',sans-serif;font-size:0.95rem;width:100%;transition:border-color 0.18s;text-align:center;letter-spacing:3px;}
    .login-senha-wrap input:focus{outline:none;border-color:var(--azul);}
    .login-olho{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--texto2);}
    .login-erro{color:var(--vermelho);font-size:0.8rem;min-height:20px;margin-bottom:8px;}
    .login-entrar-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--azul),var(--azul-dark));color:#fff;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:filter 0.15s,transform 0.1s;}
    .login-entrar-btn:hover{filter:brightness(1.08);}
    .login-entrar-btn:active{transform:scale(0.98);}

    /* LAYOUT APP */
    .app-layout{display:flex;min-height:100vh;}
    #appContent{display:none;}
    #appContent.visivel{display:flex;width:100%;}

    /* SIDEBAR ORIGINAL */
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:linear-gradient(180deg,var(--azul-dark) 0%,var(--azul) 100%);z-index:200;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;transition:transform 0.28s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 20px rgba(0,0,0,0.18);}
    .sidebar-header{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.12);flex-shrink:0;}
    .sidebar-logo{font-size:1.5rem;line-height:1;}
    .sidebar-titulo{font-family:'Nunito',sans-serif;font-weight:900;font-size:0.9rem;color:#fff;line-height:1.2;}
    .sidebar-nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:2px;}
    .sidebar-nav button{width:100%;background:transparent;color:rgba(255,255,255,0.78);border:none;padding:9px 12px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:700;font-size:0.83rem;cursor:pointer;transition:background 0.18s,color 0.18s;text-align:left;display:flex;align-items:center;gap:9px;white-space:nowrap;}
    .sidebar-nav button:hover{background:rgba(255,255,255,0.15);color:#fff;}
    .sidebar-nav button.ativo{background:rgba(255,255,255,0.22);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.15);}

    /* RESTANTE DOS ESTILOS ORIGINAIS (Notícias, Tabelas, etc.) */
    .main-wrapper{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{background:var(--azul-dark);color:#fff;padding:0 16px 0 20px;min-height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:150;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
    .secao{display:none;padding:22px;max-width:1150px;margin:0 auto;width:100%;animation:fadeIn 0.22s ease;}
    .secao.ativa{display:block;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    .card{background:var(--branco);border-radius:var(--raio);box-shadow:var(--sombra);padding:20px 22px;margin-bottom:18px;}
    .card-titulo{font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
    
    /* ESTILO ESPECÍFICO FORMULÁRIO PLANEJAMENTO */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
    textarea { width: 100%; border-radius: 8px; border: 1.5px solid var(--borda); padding: 10px; font-family: inherit; resize: vertical; }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-card">
      <div class="login-logo">🏫</div>
      <div class="login-sistema-nome">Sistema Prático Escolar</div>
      <div class="login-sistema-sub">Acesse sua conta para continuar</div>
      <div class="login-usuarios" id="listaUsuariosLogin">
        </div>
      <div class="login-senha-wrap">
        <input type="password" id="inputSenha" placeholder="••••">
      </div>
      <div class="login-erro" id="msgErroLogin"></div>
      <button class="login-entrar-btn" onclick="tentarLogin()">ENTRAR NO SISTEMA</button>
    </div>
  </div>

  <div id="appContent" class="app-layout">
    <aside class="sidebar">
       <div class="sidebar-header">
         <div class="sidebar-logo">🎓</div>
         <div class="sidebar-titulo">SISTEMA PRÁTICO<br>ESCOLAR</div>
       </div>
       <nav class="sidebar-nav">
         <button onclick="mudarSecao('inicio', this)" class="ativo">🏠 Início</button>
         <button onclick="mudarSecao('planejamento', this)">📝 Planejamento Diário</button>
         <button onclick="mudarSecao('noticias', this)">📰 Notícias</button>
         <button onclick="mudarSecao('calendario', this)">📅 Calendário</button>
         </nav>
    </aside>

    <main class="main-wrapper">
      <header class="topbar">
        <div class="topbar-title" id="txtTituloTopo">Painel de Controle</div>
        <div class="topbar-usuario">
          <div class="topbar-user-info">
            <div class="topbar-user-nome" id="userLogadoNome">Usuário</div>
          </div>
          <button class="btn-sair" onclick="logout()">Sair</button>
        </div>
      </header>

      <section id="secao-inicio" class="secao ativa">
        <div class="card">
          <h2 class="card-titulo">Olá! Bem-vindo ao sistema.</h2>
          <p>Utilize o menu lateral para acessar as funcionalidades.</p>
        </div>
      </section>

      <section id="secao-planejamento" class="secao">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 class="card-titulo">📝 Registro de Planejamento Diário</h2>
            <button class="btn btn-verde" id="btnSalvarPlan" onclick="salvarPlanejamentoGoogle()">
              💾 Salvar na Planilha
            </button>
          </div>

          <div class="form-grid">
            <div>
              <label>Professor(a)</label>
              <input type="text" id="planProf" placeholder="Nome completo">
            </div>
            <div>
              <label>Turma</label>
              <input type="text" id="planTurma" placeholder="Ex: 5º Ano A">
            </div>
            <div>
              <label>Data da Aula</label>
              <input type="date" id="planData">
            </div>
          </div>

          <label>Conteúdo Programático</label>
          <textarea id="planConteudo" rows="4" placeholder="O que será trabalhado nesta aula?"></textarea>

          <label>Objetivos e Metodologia</label>
          <textarea id="planObjetivos" rows="4" placeholder="Quais os objetivos e como será a aula?"></textarea>

          <div id="statusSalvo" style="display:none; color: var(--verde); font-weight: bold; margin-top: 15px;">
            ✓ Planejamento enviado com sucesso para a planilha!
          </div>
        </div>
      </section>

      <section id="secao-noticias" class="secao">
          </section>

      </main>
  </div>

  <script>
    /* LÓGICA DE LOGIN ORIGINAL - MANTIDA */
    const USUARIOS = [
      {id:1, nome: 'Direção', cargo: 'Gestor', senha: '123'},
      {id:2, nome: 'Professor', cargo: 'Docente', senha: '456'}
    ];
    let usuarioLogado = null;

    function renderizarLogin() {
      const container = document.getElementById('listaUsuariosLogin');
      container.innerHTML = USUARIOS.map(u => `
        <div class="login-usuario-btn" onclick="selecionarUsuario(${u.id}, this)">
          <div class="login-user-avatar">${u.nome[0]}</div>
          <div class="login-user-info">
            <div class="login-user-nome">${u.nome}</div>
            <div class="login-user-cargo">${u.cargo}</div>
          </div>
        </div>
      `).join('');
    }

    function selecionarUsuario(id, element) {
      document.querySelectorAll('.login-usuario-btn').forEach(b => b.classList.remove('selecionado'));
      element.classList.add('selecionado');
      usuarioLogado = USUARIOS.find(u => u.id === id);
    }

    function tentarLogin() {
      const senha = document.getElementById('inputSenha').value;
      if(!usuarioLogado || senha !== usuarioLogado.senha) {
        document.getElementById('msgErroLogin').innerText = "Credenciais inválidas!";
        return;
      }
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appContent').classList.add('visivel');
      document.getElementById('userLogadoNome').innerText = usuarioLogado.nome;
    }

    /* NAVEGAÇÃO ENTRE ABAS */
    function mudarSecao(id, btn) {
      document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
      document.getElementById('secao-' + id).classList.add('ativa');
      document.querySelectorAll('.sidebar-nav button').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
      document.getElementById('txtTituloTopo').innerText = btn.innerText;
    }

    /* FUNÇÃO DE SALVAMENTO NO GOOGLE SHEETS (ACRESCENTADO) */
    function salvarPlanejamentoGoogle() {
      const btn = document.getElementById('btnSalvarPlan');
      const dados = {
        professor: document.getElementById('planProf').value,
        turma: document.getElementById('planTurma').value,
        data: document.getElementById('planData').value,
        conteudo: document.getElementById('planConteudo').value,
        objetivos: document.getElementById('planObjetivos').value
      };

      if(!dados.professor || !dados.conteudo) {
        alert("Preencha pelo menos o nome do professor e o conteúdo!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "⏳ Enviando...";

      // Chama a função 'salvarNoSheets' que deve estar no seu arquivo Codigo.gs
      google.script.run
        .withSuccessHandler(() => {
          btn.disabled = false;
          btn.innerText = "💾 Salvar na Planilha";
          document.getElementById('statusSalvo').style.display = 'block';
          setTimeout(() => document.getElementById('statusSalvo').style.display = 'none', 4000);
          // Limpa o formulário após salvar
          document.getElementById('planConteudo').value = "";
          document.getElementById('planObjetivos').value = "";
        })
        .withFailureHandler(err => {
          alert("Erro ao salvar: " + err);
          btn.disabled = false;
        })
        .salvarNoSheets(dados); 
    }

    // Inicialização
    renderizarLogin();
  </script>
</body>
</html>
