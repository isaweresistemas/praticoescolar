<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Prático Escolar - V2</title>
  <script>
    // Nova função para salvar o planejamento na planilha
    function salvarPlanejamentoNoGoogle() {
      const dados = {
        professor: document.getElementById('planProfessor').value,
        turma: document.getElementById('planTurma').value,
        data: document.getElementById('planData').value,
        conteudo: document.getElementById('planConteudo').value,
        objetivos: document.getElementById('planObjetivos').value
      };

      if(!dados.professor || !dados.conteudo) {
        alert("Por favor, preencha os campos principais.");
        return;
      }

      // Chama a função no Google Apps Script
      google.script.run
        .withSuccessHandler(() => {
          alert("Planejamento salvo com sucesso na planilha!");
          limparFormularioPlanejamento();
        })
        .withFailureHandler(err => alert("Erro ao salvar: " + err))
        .salvarPlanejamento(dados);
    }

    // Mantém todas as outras funções originais de login, navegação e dados
    // ... 
  </script>
</head>
